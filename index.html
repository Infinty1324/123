<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI科普智能体</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
}

body {
  width: 100vw;
  height: 100vh;
  background: linear-gradient(135deg, #0f1729 0%, #1a2343 50%, #26365c 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 800px;
  text-align: center;
  padding: 40px 20px;
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  font-size: 60px;
  margin-bottom: 20px;
  background: linear-gradient(90deg, #4fc3f7, #81c784, #b39ddb);
  -webkit-background-clip: text;
  color: transparent;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { filter: brightness(1); }
  to { filter: brightness(1.3); }
}

.title {
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 18px;
  color: #a0b4d8;
  margin-bottom: 40px;
  line-height: 1.6;
}

.card-group {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  width: 160px;
  padding: 24px 16px;
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  background: rgba(255,255,255,0.12);
  border-color: rgba(79, 195, 247, 0.4);
}

.card-icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.card-title {
  font-size: 15px;
  font-weight: 500;
  color: #e1edff;
}

.bottom-text {
  margin-top: 50px;
  font-size: 14px;
  color: #7a92c3;
}
</style>
</head>

<body>
<div class="container">
  <div class="logo">🤖</div>
  <div class="title">AI科普智能体 · 欢迎您</div>
  <div class="subtitle">
    在这里探索人工智能的世界<br>
    趣味问答、错题记忆、知识点学习、智能答疑一站式体验
  </div>

  <div class="card-group">
    <div class="card">
      <div class="card-icon">🎯</div>
      <div class="card-title">趣味问答</div>
    </div>
    <div class="card">
      <div class="card-icon">📚</div>
      <div class="card-title">错题记忆</div>
    </div>
    <div class="card">
      <div class="card-icon">🧠</div>
      <div class="card-title">知识点学习</div>
    </div>
    <div class="card">
      <div class="card-icon">💬</div>
      <div class="card-title">智能答疑</div>
    </div>
  </div>

  <div class="bottom-text">
    AI科普智能助手 · 让学习更智能、更高效
  </div>
</div>
</body>
</html>
