<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI科普智能体欢迎页</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", sans-serif;
}
body {
  width: 260px;
  background: #f0f9f4; /* 和你截图背景一致的浅绿底色 */
  display: flex;
  justify-content: center;
  padding: 10px;
}
.welcome-box {
  width: 240px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0, 100, 50, 0.08);
  border: 1px solid rgba(200, 230, 210, 0.6);
  padding: 20px 16px;
  text-align: center;
}
/* 顶部欢迎标题 */
.header-icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.title {
  font-size: 18px;
  font-weight: bold;
  color: #2e7d32;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 13px;
  color: #666;
  line-height: 1.5;
  margin-bottom: 20px;
}
/* 功能卡片网格 */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.feature-card {
  background: #f8fff9;
  border-radius: 10px;
  padding: 14px 8px;
  border: 1px solid #e0f2e9;
  transition: all 0.2s ease;
  cursor: pointer;
}
.feature-card:hover {
  background: #e8f5e9;
  border-color: #a5d6a7;
  transform: translateY(-2px);
}
.feature-icon {
  font-size: 24px;
  margin-bottom: 6px;
}
.feature-name {
  font-size: 13px;
  color: #333;
}
/* 底部提示 */
.footer-tip {
  font-size: 11px;
  color: #888;
}
</style>
</head>
<body>
<div class="welcome-box">
  <div class="header-icon">🤖</div>
  <div class="title">欢迎来到AI科普智能体</div>
  <div class="subtitle">
    在这里探索人工智能的世界<br>
    趣味问答、错题记忆、知识点学习一站式体验
  </div>

  <div class="feature-grid">
    <div class="feature-card">
      <div class="feature-icon">🎯</div>
      <div class="feature-name">趣味问答</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">📚</div>
      <div class="feature-name">错题记忆</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">🧠</div>
      <div class="feature-name">知识点学习</div>
    </div>
    <div class="feature-card">
      <div class="feature-icon">💬</div>
      <div class="feature-name">智能答疑</div>
    </div>
  </div>

  <div class="footer-tip">点击卡片进入对应功能</div>
</div>
</body>
</html>
